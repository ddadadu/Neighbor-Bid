services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"          # EC2에서는 "80:80"으로 변경
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
    depends_on:
      - web

  web:
    build: ./web
    env_file: .env
    volumes:
      - appdata:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  appdata: